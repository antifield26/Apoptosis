# Example server configuration (P01-06). Copy and edit; pass to `mc-server config.toml`.
# Every value below is also the built-in default, so deleting a line keeps working.

[network]
# Socket to bind.
bind = "127.0.0.1:25565"
# Concurrent player slots (product contract: 10).
max_players = 10
# Mojang authentication. Default OFF; set true to verify logins against
# Mojang's session server (P19-05, ADR-0008): RSA handshake, `hasJoined`
# check, encrypted transport. Needs outbound HTTPS to sessionserver.
online_mode = false
# Compression threshold in bytes; -1 disables compression.
compression_threshold = 256
# Server-list description.
motd = "A Rust Minecraft Server"

[simulation]
# Chunk view distance radius. Vanilla default 10; 8 until the Pi-5 benchmark (P08) says otherwise.
view_distance = 8

[storage]
# World directory (relative to the process working directory).
world_dir = "world"
# Ticks between autosaves at 20 TPS (6000 = 5 min); 0 disables the timer.
autosave_ticks = 6000
# World seed for generation, when the operator names one. Unset means "no
# opinion": a world whose level.dat already records a seed keeps generating
# from it; a fresh world generates from seed 0. A stored seed always wins,
# so setting this cannot fork an existing world.
# seed = 1361882806

[access]
# Enforce `whitelist.json` at login (Vanilla's `white-list`, default off).
# A profile that is neither listed nor an operator is refused with Vanilla's
# message. `/whitelist on|off` toggles it live; a restart restores this value.
whitelist_enforced = false

[gameplay]
# Spawn protection radius in blocks (Vanilla `spawn-protection`, default 16;
# 0 disables). Enforcement is P20-owned; this release only stores it.
spawn_protection = 16
# Whether players may damage each other (Vanilla `pvp`, default true).
# The damage gate is P20-owned.
pvp = true
# Minutes of inactivity before disconnect (Vanilla `player-idle-timeout`,
# default 0 = disabled). The idle tracker is P20-owned.
idle_timeout_minutes = 0
# Tick radius in chunks (Vanilla `simulation-distance`, default 8 like
# view_distance). Stored now; ticking honours it in P20.
simulation_distance = 8
# Game mode for new players (Vanilla `gamemode`): "survival" (default),
# "creative", "adventure" or "spectator". Applied at join by P20.
default_gamemode = "survival"
# Whether the status response hides the player sample (Vanilla
# `hide-online-players`, default false). Wiring is P20-owned.
hide_online_players = false

[rcon]
# Serve the RCON admin protocol. Default off: an admin protocol that answers
# commands must be opted into, never on by accident. Enabling with an empty
# password is refused at validation.
enabled = false
# Socket to bind. Default loopback (Vanilla's 127.0.0.1:25575): the password
# crosses the wire in the clear, so think twice before moving it off loopback
# (the server warns when bound elsewhere).
bind = "127.0.0.1:25575"
# RCON password. Empty by default; set one to enable RCON.
password = ""

[datapacks]
# Optional: the **vanilla** data pack — the 26.1.2 server jar's own
# `data/minecraft`. That data is Mojang's, so it is deliberately not committed
# here and this key is unset by default; extract it from the jar you supply
# (see docs/research/data-pack-baseline.md section 0).
#
# Point it at the extracted `data/minecraft` directory, or at a pack root that
# contains it — both work, because the two are indistinguishable from outside.
# It is what loads vanilla functions, recipes, tags and structures.
#
# Leaving it unset is a real state, not a degraded mode: with no vanilla data,
# **no** vanilla function, recipe or tag loads, so `/function` reports unknown
# names and generated terrain carries no structures. World packs still load
# from `<world_dir>/datapacks/`, filtered by the world's own enabled-pack list.
# vanilla_data = "/opt/minecraft/data/minecraft"
