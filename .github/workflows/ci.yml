name: ci

# Runs the five quality gates (fmt, clippy, tests, aarch64 cross-check,
# cargo-deny) on both host platforms, plus the documentation audit
# (tools/docs-audit/). The workflow first executed on 2026-09-12 when the
# repository gained its remote; results are visible under the Actions tab.
#
# **Every job carries an explicit `timeout-minutes`** (TEST-TIME-PLAN §4): the
# GitHub default is 360 minutes, so a hung suite used to burn six runner-hours
# silently instead of failing loudly. The budgets are ~4x the measured wall
# clock on the development host (tests ≈ 7.5 min for `cargo test`, ≈ 5.7 min
# for `cargo nextest`), which leaves room for a cold cache without leaving room
# for a hang.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # The full tier below runs nightly (03:00 UTC) so the canonical figures are
    # re-derived on a fixed cadence, not only when someone remembers.
    - cron: '0 3 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  check-x86_64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "stable"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The per-push tier: nextest schedules across test binaries instead of
      # running them one at a time (452 s -> 344 s on the development host), and
      # `.config/nextest.toml` carries the retry policy for the two suites with
      # written flake history. The canonical `cargo test` total is still owned
      # by the nightly/full tier below.
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --no-fail-fast
      - run: cargo build --workspace --release

  check-linux:
    # The production target is Linux, and the development host is Windows, so the
    # *host* difference is worth testing on an ordinary runner: platform-specific
    # code, path handling, file locking and the temp-dir behaviour all differ.
    #
    # This runs the same gates natively rather than cross-compiling, because a
    # cross-`check` does not link and would miss a linker or libc problem.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "stable"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Linux runs the *canonical* tier: this is the job whose figure the
      # matrices quote, so it stays `cargo test` rather than nextest.
      - run: cargo test --workspace --no-fail-fast

  check-aarch64:
    # P01-11: the Pi 5 target must at least typecheck + clippy-clean on every push.
    #
    # Cross-`check` on an x86_64 runner, deliberately: GitHub's *hosted* arm64
    # runners are available for public repositories only, so `ubuntu-24.04-arm`
    # would silently never be scheduled for a private repo and the gate would be
    # fictional while looking present. A cross-check is weaker than running on
    # arm64 — it does not link — and that limitation is stated rather than papered
    # over by naming a runner that may not exist.
    #
    # Running natively on arm64 belongs to the P08 Pi harness, where the hardware is
    # real and the benchmark needs it anyway.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "stable"
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu
      # **A cross C compiler is needed even for a `check`.** `cc-rs` runs a
      # dependency's build script whether or not the crate links, and `ring`
      # (through `ureq` -> `rustls`, the online-mode session check) builds C and
      # assembly. Without this the job died in ~30 s with "failed to find tool
      # aarch64-linux-gnu-gcc" on every push from P19-05 to P19-07. The job still
      # does not *link* the workspace — this only lets the build scripts run — so
      # the limitation its comment above states is unchanged.
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo check --target aarch64-unknown-linux-gnu --workspace --all-targets
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

  dependency-policy:
    # P01-03 / ADR-0001 D-08: the licence/dependency gate the policy promises.
    # Policy and local usage: docs/operations/DEPENDENCY-POLICY.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "stable"
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses bans sources
      # Advisories are reported but not enforced: no triage process exists yet,
      # and failing on an unfixed upstream advisory would block unrelated work.
      - run: cargo deny check advisories
        continue-on-error: true

  docs-audit:
    # The mechanical half of documentation health: every tracked text file is
    # valid UTF-8, no document references a file the repository does not ship,
    # and the workspace test total is stated identically wherever it appears
    # (that last one exists because six documents used to restate it by hand,
    # and one drifted -- Audit 07 finding M2). Scripts and rules:
    # tools/docs-audit/, CONTRIBUTING.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The link checker resolves citations of retired documentation against
      # the archive tag; a shallow checkout would not have it, so fetch it
      # explicitly.
      - run: git fetch --depth=1 origin +refs/tags/phase-09-final:refs/tags/phase-09-final
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/docs-audit/check_encoding.py
      - run: python tools/docs-audit/check_links.py
      - run: python tools/docs-audit/check_gate_totals.py
      - run: python tools/docs-audit/check_line_endings.py

  # The full tier on a schedule (TEST-TIME-PLAN §4): the canonical `cargo test`
  # total, the aarch64 cross-check and the dependency policy, nightly rather than
  # per push, so the numbers the matrices quote are re-derived on a fixed cadence
  # and a per-push regression is still caught by the jobs above.
  nightly-full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "stable"
          components: rustfmt, clippy
      - run: cargo test --workspace --no-fail-fast
      # The acceptance suites are `#[ignore]`d on purpose (jar-gated
      # differentials, distribution statistics, the benchmark harness): the full
      # tier runs them so an ignored suite cannot rot unnoticed.
      - run: cargo test --workspace --no-fail-fast -- --ignored

