# cargo-deny configuration (P01-03 / ADR-0001 D-08).
#
# The project has no licence of its own yet (ADR-0001 R-09), which makes
# copyleft reuse forbidden rather than merely discouraged. This gate enforces the
# policy recorded in docs/legal/third-party.md section 2:
#   * only permissive licences may enter the dependency tree;
#   * crates are fetched from crates.io only (no git forks of GPL projects);
#   * wildcard dependency requirements are rejected.
#
# Run locally with `cargo deny check` (see docs/operations/DEPENDENCY-POLICY.md).

[graph]
all-features = true

[advisories]
# Advisories are reported by CI (`cargo deny check advisories`) but do not fail
# the build until a triage process exists; ignoring nothing silently.
version = 2

[licenses]
# Permissive licences only. Anything copyleft must be an explicit owner +
# legal decision first (AGENTS.md section 6), which means editing this list in a
# reviewed commit.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

# Our own crates are unpublished (`publish = false` in the workspace manifest) and
# carry no licence field, because the project's licence is **undecided** (ADR-0001
# R-09, an owner action). Ignoring them here makes this gate check what the policy is
# actually about — the third-party tree — instead of failing forever on a decision the
# agent cannot make. It does **not** resolve R-09: see docs/operations/DEPENDENCY-POLICY.md.
#
# Without this, the first real run of this gate failed with `error[unlicensed]:
# mc-container = 0.1.0 is unlicensed` for all 15 workspace members.
private = { ignore = true }

[bans]
multiple-versions = "allow"
# Reject a wildcard requirement from a *registry*: that is the supply-chain hazard the
# rule exists for. Path dependencies are exempt because they are vendored in this
# repository — every internal crate is referenced that way, and `wildcards = "deny"`
# without this flag rejects all 40+ of them. Verified by running the gate: before this
# flag, `cargo deny check bans` failed on `mc-core = { path = "../core" }`.
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Reference implementations of Minecraft servers, all copyleft or
    # licence-ambiguous for our purposes: never dependencies (docs/legal/third-party.md).
    { name = "pumpkin", reason = "GPL-3.0 reference implementation; clean-room policy forbids reuse" },
    { name = "pumpkin-protocol", reason = "GPL-3.0 reference implementation" },
    { name = "pumpkin-world", reason = "GPL-3.0 reference implementation" },
    { name = "valence_protocol", reason = "reference implementation; design may inform, code may not be vendored" },
    { name = "minestom", reason = "reference implementation; not a Rust dependency, listed for clarity" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
