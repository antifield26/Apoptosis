# MinecraftServer — workspace root (virtual manifest).
# Phase 01 (P01-01): workspace + shared package metadata + lint contract.
#
# License: MIT (owner decision 2026-09-12, ADR-0006) — closes ADR-0001 R-09.
# The GPL/AGPL reuse ban for *third-party* material is unchanged
# (docs/legal/third-party.md, section 2); see `license = "MIT"` below.

[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
# This workspace builds a server binary, not libraries for crates.io. Declaring that
# is not cosmetic: `cargo deny` requires *publishable* crates to version their path
# dependencies (crates.io forbids a versionless path dep in a published crate), and
# every internal crate here is referenced by path with its version in this table.
# `publish = false` states the real intent and lets the licence gate check what it is
# actually for — the third-party registry dependencies.
publish = false

# Quality gate shared by every crate (DoD item 9):
# `cargo fmt --check` + `cargo clippy -- -D warnings` must pass.
# `unsafe_code = "forbid"`: any future justified use (AGENTS.md section 2)
# must first relax this gate with an ADR, not a silent allow.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
derivable_impls = "allow"

# Shared dependency pins. Added only at adoption time with a
# docs/legal/third-party.md row (P00-09 policy). Caret reqs + committed
# Cargo.lock give reproducible builds; see rust-toolchain.toml for the compiler pin.
[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
flate2 = "1"
uuid = "1"
md-5 = "0.10"
# P19-05 online-mode auth (ADR-0008): RSA keypair + PKCS#1 v1.5 decrypt for
# the login handshake, SHA-1 for the Minecraft server-id hash, AES-128/CFB8
# for the stream cipher, a CSPRNG for keygen, and blocking HTTPS for the
# Mojang session-server check (run off-thread). All MIT/Apache-2.0 RustCrypto
# or equivalent permissive crates; versions pinned by Cargo.lock.
rsa = "0.9"
aes = "0.8"
# 0.8, not 0.9: cfb8 0.9 moved to `cipher` 0.5 while `aes` 0.8 still speaks
# 0.4, and the two cannot compose. 0.8.1 pairs with `cipher` 0.4 (verified
# in Cargo.lock); the mode on the wire is identical either way.
cfb8 = "0.8"
sha1 = "0.10"
rand = "0.8"
ureq = "3"
