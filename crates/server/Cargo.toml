[package]
name = "mc-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mc-core = { path = "../core" }
mc-command = { path = "../command" }
mc-container = { path = "../container" }
# For the bounded JSON boundary `mc_data::json`, used to read `ops.json`:
# an operator-supplied file must go through the same size/depth policy as a pack.
mc-data = { path = "../data" }
# Only for `serde_json::Value` as a type; the *policy* for reading JSON is
# `mc_data::json`, which is what `ops.rs` calls.
serde_json.workspace = true
mc-entity = { path = "../entity" }
mc-network = { path = "../network" }
mc-nbt = { path = "../nbt" }
mc-persistence = { path = "../persistence" }
mc-protocol = { path = "../protocol" }
mc-registry = { path = "../registry" }
# The redstone update/scheduled-tick queue (P13-01). `mc-redstone` owns the
# queue mechanics; the server owns when it drains (ScheduledTicks phase) and,
# from P13-02, what feeds it.
mc-redstone = { path = "../redstone" }
# The tick scheduler and phase order (P05-01/P05-02). `mc-simulation` owns the
# shape of a tick and depends on nothing but `mc-core`, so the dependency runs
# server → simulation and never the other way.
mc-simulation = { path = "../simulation" }
mc-world = { path = "../world" }
mc-worldgen = { path = "../worldgen" }
serde.workspace = true
thiserror.workspace = true
# `signal` is required by the Ctrl-C handler; without it `cargo build -p mc-server`
# fails even though a full-workspace build passes (feature unification hid it).
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "signal"] }
toml.workspace = true
tracing.workspace = true
# The UUID an entity is announced with; the type is shared with mc-entity and mc-protocol
# rather than converted at each boundary.
uuid.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
mc-test-support = { path = "../test-support" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
