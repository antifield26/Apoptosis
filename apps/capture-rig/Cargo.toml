[package]
name = "mc-capture-rig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "capture-rig"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mc-protocol = { path = "../../crates/protocol" }
# Comparison digests for trace records. MD5 is already a workspace dependency (offline UUIDs
# in `mc-network`); here it is a cheap stable fingerprint, **not** a security primitive, and
# the trace format says so.
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true
# `time` is required by `relay.rs` for the bounded session drain. It was missing here and the crate
# still built inside the workspace, because feature unification let other members supply it -- so
# `cargo build -p mc-capture-rig` alone failed while `cargo build --workspace` succeeded. A crate
# must declare what it uses.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tracing.workspace = true

[dev-dependencies]
mc-server = { path = "../../crates/server" }
mc-test-support = { path = "../../crates/test-support" }
# The tests build compressed frames by hand to prove the digest ignores compression; the
# workspace already depends on flate2 for the real codec.
flate2.workspace = true
